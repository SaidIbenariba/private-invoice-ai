[project]
name = "invoice-ai"
version = "0.1.0"
description = "Invoices, scans and phone photos to validated data, running 100% locally with Ollama."
readme = "README.md"
authors = [
    { name = "Said Ibenariba" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdfium2>=5.14.0",
    "reportlab>=5.0.1",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
